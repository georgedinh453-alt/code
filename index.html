<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockVerse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="brand">BlockVerse</div>
      <div class="stats">
        <span>Gems: <strong id="gem-count">0</strong></span>
        <span>Build: <strong id="build-status">OFF</strong></span>
      </div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div class="info-panel">
      <h1>Roblox-inspired prototype</h1>
      <p>Move with A/D or arrow keys, jump with Space, and press B to toggle build mode.</p>
      <p>Click to place a block in build mode.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
